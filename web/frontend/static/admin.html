<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 · 域策 DomSense</title>
    <!-- 粒子背景样式 -->
    <link rel="stylesheet" href="/static/css/particles.css">
    <!-- 主样式 -->
    <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
    <!-- 粒子背景容器 -->
    <div id="particles-js"></div>

    <div class="container">
        <h1>管理后台</h1>
        <p class="subtitle">模型信息 · 反馈统计 · 数据上传 · 训练管理</p>

        <!-- 模型信息 -->
        <div class="card">
            <div class="card-title">模型信息</div>
            <div id="model-info">
                <div style="color:#9ca3af;">加载中...</div>
            </div>
        </div>

        <!-- 反馈统计 -->
        <div class="card">
            <div class="card-title">反馈统计</div>
            <div class="progress-ring" style="--progress: 0%;">
                <div class="progress-ring-inner">
                    <div class="progress-ring-text">0/50</div>
                    <div class="progress-ring-label">累计反馈</div>
                </div>
            </div>
            <div id="feedback-stats-text"></div>
        </div>

        <!-- CSV 上传 -->
        <div class="card">
            <div class="card-title">CSV 数据上传</div>
            <div id="drop-zone" class="drop-zone">
                <div class="drop-text">点击或拖拽 CSV 文件到此区域</div>
                <input type="file" id="csv-file" accept=".csv">
            </div>
        </div>

        <!-- 上传按钮行 -->
        <div class="button-row">
            <button id="btn-upload" class="btn-cyber">上传 CSV</button>
        </div>

        <!-- 手动训练 -->
        <div class="card">
            <div class="card-title">手动训练</div>
            <div class="form-group">
                <label for="max-steps">最大训练步数</label>
                <input type="number" id="max-steps" value="200" min="1">
            </div>
            <div class="form-group">
                <label for="run-name">运行名称</label>
                <input type="text" id="run-name" placeholder="手动训练_run">
            </div>
        </div>

        <!-- 训练按钮行 -->
        <div class="button-row">
            <button id="btn-train" class="btn-cyber btn-purple">立即触发训练</button>
        </div>

        <!-- 训练记录 -->
        <div class="card">
            <div class="card-title">训练记录</div>
            <table id="training-records-table">
                <thead><tr><th>加载中...</th></tr></thead>
                <tbody><tr><td style="color:#9ca3af;">正在加载...</td></tr></tbody>
            </table>
        </div>
    </div>

    <!-- 脚本 -->
    <script src="/static/js/particles.min.js"></script>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/admin.js"></script>
</body>
</html>
